[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "neuralcore"
version = "0.1.0"
description = "A from-scratch NumPy research laboratory for deep fully connected neural networks."
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["numpy>=1.23"]

[project.optional-dependencies]
viz = ["matplotlib>=3.6"]
dev = ["pytest>=7.0", "matplotlib>=3.6"]

[tool.setuptools.packages.find]
where = ["."]
include = ["neuralcore*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
